- type: entity
  name: Toy Spawner
  id: ToySpawner
  parent: MarkerBase
  placement:
    mode: PlaceFree  # Reserve: Better spawners
  components:
    - type: Transform
      anchored: false  # Reserve: Better spawners
    - type: Sprite
      layers:
      - state: red
      - sprite: Objects/Fun/Plushies/bee.rsi
        state: icon
    - type: RandomSpawner
      rarePrototypes:
        - FoamBlade
        - PlushieGhost
      rareChance: 0.03
      prototypes:
        - PlushieBee
        - PlushieAtmosian
        - PlushieNuke
        - PlushieLizard
        - PlushieNar
        - PlushieCarp
        - PlushieSlime
        - PlushieSnake
        - PlushieVox
        - PlushieRatvar
        - PlushieSpaceLizard
        - PlushieRouny
        - PlushieLamp
        - PlushieSharkBlue
        - PlushieSharkPink
        - PlushieSharkGrey
        - ToyAmongPequeno
        - ToyMouse
        - PlushieDiona
        - PlushieArachind
        - PlushieBingle # Goobstation
        - PlushieSamantha # Goobstation
        - PlushieJvne # Goobstation
        - PlushieFern # Goobstation
        - PlushieAbductor # Goobstation
        # WD EDIT START
        - FaceHuggerToys
        # WD EDIT END
      chance: 0.5
      offset: 0.2

