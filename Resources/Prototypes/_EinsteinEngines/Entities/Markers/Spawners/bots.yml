- type: entity
  name: plantbot spawner
  id: SpawnMobPlantbot
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _EinsteinEngines/Mobs/Silicon/Bots/plantbot.rsi
        state: plantbot
  - type: ConditionalSpawner
    prototypes:
      - MobPlantbot

# Reserve: Better spawners start
- type: entity
  name: weldbot spawner
  parent: MarkerBase
  id: SpawnMobWeldbot
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _EinsteinEngines/Mobs/Silicon/Bots/weldbot.rsi
      state: weldbot
  - type: ConditionalSpawner
    prototypes:
    - MobWeldbot

# Chance 10%

- type: entity
  id: SpawnMobPlantbotChance10
  parent: SpawnMobPlantbot
  suffix: 10% chance
  components:
  - type: ConditionalSpawner
    prototypes:
      - MobPlantbot
    chance: 0.1

- type: entity
  id: SpawnMobWeldbotChance10
  parent: SpawnMobWeldbot
  suffix: 10% chance
  components:
  - type: ConditionalSpawner
    prototypes:
      - MobWeldbot
    chance: 0.1
# Reserve: Better spawners end
