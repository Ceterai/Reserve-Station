- type: gameMap
  id: ReserveReach
  mapName: 'Reach-1'
  mapPath: /Maps/_Reserve/reach.yml
  minPlayers: 0
  maxPlayers: 12
  stations:
    ReserveReach:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Корабль Рич-1 {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'СТ'
        - type: StationJobs
          availableJobs:
            NanotrasenRepresentative: [ 1, 1 ] # Goobstation
            BlueshieldOfficer: [ 1, 1 ] # Goobstation
            Captain: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            SecurityOfficer: [ 1, 2 ]
            CargoTechnician: [ 1, 1 ]
            SalvageSpecialist: [ 1, 2 ]
            Bartender: [ 1, 1 ]
            Botanist: [ 1, 1 ]
            Chef: [ 1, 1 ]
            MedicalDoctor: [ 1, 2 ]
            Chemist: [ 1, 1 ]
            Janitor: [ 1, 1 ]
            Clown: [ 1, 1 ]
            Musician: [ 1, 1 ]
            AtmosphericTechnician: [ 1, 1 ]
            StationEngineer: [ 1, 2 ]
            Scientist: [ 1, 1 ]
            StationAi: [ 1, 1 ]
            Passenger: [ -1, -1 ]

        # Goobstation blob-config-start LOW
        - type: StationBlobConfig
          stageBegin: 15
          stageCritical: 200
          stageTheEnd: 400
        # Goobstation blob-config-end
