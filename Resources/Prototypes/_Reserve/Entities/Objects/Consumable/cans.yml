# Orchid's Barmania - Vendichaos start
- type: entity
  parent: DrinkCanBaseFull
  id: DrinkCan
  name: aluminium can
  suffix: Empty
  description: Buy this if you hate the environment.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
      grindable:
        reagents:
        - ReagentId: Aluminium
          Quantity: 4
        - ReagentId: Iron
          Quantity: 1
  - type: Sprite
    sprite: _Reserve/Objects/Consumable/Drinks/Cans/default.rsi
  - type: Item
    sprite: _Reserve/Objects/Consumable/Drinks/Cans/default.rsi

