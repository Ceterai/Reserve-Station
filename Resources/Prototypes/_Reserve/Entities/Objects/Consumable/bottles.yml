# Orchid's Barmania - Vendichaos start
- type: entity
  parent: BaseFoodCondimentBottle
  id: DrinkBottleTall
  name: bottle
  description: Perfect for cooking.
  components:
  - type: Sprite
    layers:
    - state: bottle-empty
      map: ["enum.OpenableVisuals.Layer"]
    - state: label-o
    - state: bottle-alpha-6
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: true
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: Icon
    state: bottle-coldsauce

- type: entity
  parent: [DrinkBottleVisualsOpenable, DrinkBottleGlassBaseFull]
  id: DrinkBottle
  name: bottle
  description: Hopefully no microplastics inside.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
  - type: Sprite
    sprite: _Reserve/Objects/Consumable/Drinks/Bottles/default.rsi
    layers:
      - state: icon
        map: ["enum.OpenableVisuals.Layer"]
      - state: fill-1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-

