- type: entity
  parent: ClothingMaskBreath
  id: ClothingMaskBreathBotanist
  name: botanical breath mask
  description: This sturdy breathing mask also protects botanist's face from slashy plants.
  components:
  - type: Sprite
    sprite: _Reserve/Clothing/Mask/botanical.rsi
  - type: Clothing
    sprite: _Reserve/Clothing/Mask/botanical.rsi
  - type: Armor
    coverage:
    - Head
    modifiers:
      coefficients:
        Slash: 0.85

- type: entity
  parent: ClothingMaskBreath
  id: ClothingMaskBreathChemist
  name: chemical breath mask
  description: This mask protects against light chemical hazards.
  components:
  - type: Sprite
    sprite: _Reserve/Clothing/Mask/chemical.rsi
  - type: Clothing
    sprite: _Reserve/Clothing/Mask/chemical.rsi
  - type: Armor
    coverage:
    - Head
    modifiers:
      coefficients:
        Caustic: 0.85
